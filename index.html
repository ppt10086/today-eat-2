<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天吃什么 ♡</title>
<style>
:root{
  --bg:#fff6f8; --card:#fff; --peach:#ffdee7; --rose:#f65e84; --rose2:#e64a76;
  --cocoa:#5b4636; --mocha:#a08b7e; --line:#ffd9e4; --mint:#8fe3cf; --butter:#ffd166;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--cocoa);background-image:radial-gradient(rgba(246,94,132,.12) 2px,transparent 2.6px);background-size:26px 26px}
body.motion-off *{animation:none!important;transition:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:14px;border:2.5px solid var(--line);border-radius:14px;padding:10px 12px;outline:none;background:#fff}
input:focus,textarea:focus{border-color:var(--rose)}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 90px}
.wrap{transform-origin:top center}
.title{font-family:"Ma Shan Zheng","ZCOOL KuaiLe",cursive;font-size:34px;color:var(--rose2);text-align:center;line-height:1.2}
.sub{text-align:center;color:var(--mocha);font-size:13px;margin:2px 0 12px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.tabs button{flex:1;max-width:150px;padding:9px 0;border-radius:16px;background:#fff;border:2.5px solid var(--line);font-weight:700;color:var(--mocha);font-size:14px}
.tabs button.on{background:var(--peach);border-color:var(--rose);color:var(--rose2)}
.card{background:var(--card);border:2.5px solid var(--line);border-radius:22px;box-shadow:0 4px 16px rgba(246,94,132,.12);padding:14px;margin-bottom:12px}
.bean-bar{display:flex;align-items:center;justify-content:space-between}
.bean-bar .bean{font-weight:800;color:var(--rose2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;background:linear-gradient(135deg,#ff8fab,#f65e84);color:#fff;box-shadow:0 4px 0 #d94a76;transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn.soft{background:#fff;color:var(--rose2);border:2px solid var(--line);box-shadow:0 3px 0 rgba(246,94,132,.15)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.modes button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border-radius:20px;background:#fff;border:2.5px solid var(--line);font-weight:700;color:var(--mocha)}
.modes button.on{border-color:var(--rose);color:var(--rose2);background:var(--peach)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--peach);padding:3px 10px;font-size:12px;font-weight:700}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--rose2);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:99;animation:rise .3s ease-out}
@keyframes rise{from{transform:translate(-50%,14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
/* 转盘 */
.wheel-box{display:flex;flex-direction:column;align-items:center;gap:12px}
.wheel{position:relative;width:min(300px,80vw);height:min(300px,80vw);border-radius:50%;border:7px solid #fff;box-shadow:0 8px 24px rgba(246,94,132,.25);transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
.wheel .seg{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px}
.wheel .seg img{width:30px;height:30px;transform:scale(1.3)}
.wheel-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:#fff;border:5px solid #fff;box-shadow:0 4px 0 rgba(246,94,132,.35);font-family:"Ma Shan Zheng",cursive;font-size:20px;color:var(--rose2)}
.needle{position:absolute;left:50%;top:-6px;transform:translateX(-50%) rotate(45deg);width:18px;height:18px;background:var(--rose2);border-radius:4px}
/* 抽卡 */
.pool-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.star{display:inline-block;width:12px;height:12px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:var(--star,#f6c453)}
.pool-chips .star{background:#f6c453}.pool-chips .star.s4{background:#c9a6ff}.pool-chips .star.s3{background:#6fc1ff}
.wish-btns{display:flex;gap:10px;justify-content:center;margin:10px 0}
.wish-btns .btn{background:linear-gradient(135deg,#ffe9a8,#f2c15c);color:#5b3f12;box-shadow:0 4px 0 #cf9f3a}
/* 十连覆盖层 */
.overlay{position:fixed;inset:0;z-index:60;overflow:auto;background:linear-gradient(180deg,#ffe9f0 0%,#d9e9ff 55%,#f4ecff 100%)}
.sky-beams{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.beam{position:absolute;top:0;height:75%;width:70px;background:linear-gradient(180deg,rgba(255,216,130,.5),rgba(255,216,130,0) 85%);filter:blur(5px);animation:floaty 3.2s ease-in-out infinite}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;animation:floaty 3.2s ease-in-out infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:60%;height:60%;left:-18%;top:-30%}
.cloud::after{width:50%;height:50%;right:-14%;top:-22%}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.grid10{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:16px 0}
.pcard{position:relative;aspect-ratio:3/4;perspective:900px;cursor:default}
.pcard .back,.pcard .face{position:absolute;inset:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;backface-visibility:hidden;transition:transform .5s}
.pcard .back{background:#17203f;border:2px solid #3a4a7a;color:#7e93c4;font-size:22px}
.pcard .face{transform:rotateY(180deg);border:2px solid var(--star);background:linear-gradient(180deg,color-mix(in srgb,var(--star) 14%,#fff),#fff);box-shadow:0 0 10px var(--glow)}
.pcard.open .back{transform:rotateY(180deg)}
.pcard.open .face{transform:rotateY(0)}
.pcard .face img{width:38px;height:38px}
.pcard .face .nm{font-size:11px;font-weight:700;text-align:center;line-height:1.2;padding:0 3px}
.glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:135%;height:135%;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,transparent 70%);pointer-events:none;animation:pulse 1.4s ease-in-out infinite;z-index:0}
@keyframes pulse{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.96)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
.pcard .face{position:relative}
.result-box{text-align:center;margin-top:14px}
.result-box .rname{font-family:"Ma Shan Zheng",cursive;font-size:30px;color:var(--rose2)}
/* 热榜 */
.city-row,.plat-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.city-row button,.plat-row button{padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--mocha)}
.city-row button.on,.plat-row button.on{border-color:var(--rose);background:var(--peach);color:var(--rose2)}
.rank-item{display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--line);border-radius:16px;padding:9px 12px;margin-bottom:8px}
.rank-item .rk{width:26px;font-weight:800;text-align:center;color:var(--rose2)}
.rank-item .fi{width:40px;height:40px;border-radius:50%;background:var(--peach);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rank-item .nm{flex:1;font-weight:700;font-size:14px}
.rank-item .heat{font-size:11px;color:var(--rose2);font-weight:700}
.rank-item .add{padding:5px 12px;border-radius:999px;background:var(--rose);color:#fff;font-size:12px;font-weight:700}
.rank-item .add.done{background:#cdeee3;color:#2b8a6b}
/* 菜单 */
.menu-add{display:flex;gap:8px}
.menu-add textarea{flex:1;resize:none}
.menu-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.menu-item{background:#fff;border:2.5px solid var(--line);border-radius:18px;padding:12px;text-align:center;position:relative}
.menu-item .fi{width:52px;height:52px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center}
.menu-item .fi img{width:44px;height:44px}
.menu-item .del{position:absolute;top:6px;right:8px;color:var(--mocha);font-size:14px}
.img-row{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin-bottom:8px}
.img-row button{flex:0 0 44px;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}
.img-row button.on{border-color:var(--rose);background:var(--peach)}
.img-row button img{width:32px;height:32px}
.zoom-row{display:flex;gap:8px;margin-top:8px}
.zoom-row .btn{flex:1;padding:8px}
/* 设置/登录 */
.set-row{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.switch{width:46px;height:26px;border-radius:999px;background:#ffc9d8;position:relative;transition:background .2s}
.switch.on{background:var(--rose)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on::after{left:23px}
.auth{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.auth .box{width:100%;max-width:360px;background:#fff;border:2.5px solid var(--line);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 30px rgba(246,94,132,.18)}
.auth h2{font-family:"Ma Shan Zheng",cursive;color:var(--rose2);text-align:center;font-size:28px}
.auth .note{font-size:12px;color:var(--mocha);text-align:center}
.auth input{width:100%}
.auth .seg{display:flex;border-radius:999px;background:var(--peach);padding:3px;border:2px solid var(--line)}
.auth .seg button{flex:1;padding:7px;border-radius:999px;font-weight:700;color:var(--mocha)}
.auth .seg button.on{background:#fff;color:var(--rose2)}
.foot-note{text-align:center;font-size:12px;color:var(--mocha);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">今天吃什么 ♡</div>
  <div class="sub">我们的小食堂 · 转盘和祈愿都在这里</div>
  <div class="tabs">
    <button data-view="home" class="on">吃什么</button>
    <button data-view="rank">热榜</button>
    <button data-view="menu">菜单</button>
    <button data-view="set">设置</button>
  </div>

  <section id="view-home">
    <div class="card bean-bar">
      <div>松鼠豆 <span class="bean" id="beans">15</span></div>
      <button class="btn soft" onclick="earnBeans()">点我领 10 颗</button>
    </div>
    <div class="modes">
      <button id="mode-roulette" class="on" onclick="setMode('roulette')">◎ 幸运转盘</button>
      <button id="mode-gacha" onclick="setMode('gacha')">✦ 美食抽卡</button>
    </div>
    <div id="area-roulette">
      <div class="card wheel-box">
        <div class="wheel" id="wheel"></div>
        <button class="btn" onclick="spinWheel()">开转（消耗 1 颗松鼠豆）</button>
        <div class="foot-note">菜单里没有菜的话，先去「菜单」加一点</div>
      </div>
    </div>
    <div id="area-gacha" class="hidden">
      <div class="card">
        <div class="sub" style="margin-bottom:4px">今天吃什么 · 限定卡池</div>
        <div class="pool-chips" id="poolChips"></div>
        <div class="wish-btns">
          <button class="btn" onclick="doWish(1)">祈愿 1 次（1 豆）</button>
          <button class="btn" onclick="doWish(10)">祈愿 10 次（10 豆）</button>
        </div>
        <div class="foot-note">每道菜概率均等，星级只影响特效 · <a href="javascript:void 0" onclick="toggleHist()">历史记录</a></div>
        <div id="historyBox" class="hidden card" style="margin-top:8px"></div>
      </div>
    </div>
    <div id="result" class="hidden">
      <div class="card result-box">
        <div class="fi" id="resultImg" style="width:80px;height:80px;margin:0 auto 6px"></div>
        <div class="rname" id="resultName"></div>
        <div id="resultMeta" class="sub" style="margin-top:4px"></div>
      </div>
    </div>
  </section>

  <section id="view-rank" class="hidden">
    <div class="city-row" id="cityRow"></div>
    <div class="plat-row" id="platRow"></div>
    <div id="rankList"></div>
    <div class="foot-note">当前为按区域整理的演示数据；真实实时抓取需要后台爬虫服务</div>
  </section>

  <section id="view-menu" class="hidden">
    <div class="card menu-add">
      <textarea id="menuInput" rows="3" placeholder="一行一个，比如：&#10;麻辣烫&#10;寿司&#10;奶茶"></textarea>
      <button class="btn" onclick="addMenu()">添加</button>
    </div>
    <div class="card">
      <div class="foot-note" style="text-align:left;margin-bottom:4px">给新菜挑个图片（不挑就自动配）</div>
      <div class="img-row" id="menuImgRow"></div>
      <button class="btn soft" style="width:100%" onclick="pickEmoji='';renderImgRow()">自动配图</button>
    </div>
    <div class="menu-list" id="menuList"></div>
  </section>

  <section id="view-set" class="hidden">
    <div class="card">
      <div class="sub" id="accountLine" style="margin-bottom:8px">还没有登录</div>
      <button class="btn soft" style="width:100%" id="accountBtn" onclick="openAuth()">登录 / 注册</button>
      <div class="foot-note">账户数据将存储至云端（Supabase）</div>
    </div>
    <div class="set-row"><div><b>可爱动效</b><br><small style="color:var(--mocha)">转盘和彩纸小动画</small></div><div class="switch on" id="swMotion" onclick="togglePref('motion')"></div></div>
    <div class="set-row"><div><b>提示音效</b><br><small style="color:var(--mocha)">转盘嗒嗒声和小音效</small></div><div class="switch on" id="swSound" onclick="togglePref('sound')"></div></div>
    <div class="set-row"><div><b>画面缩放</b><br><small style="color:var(--mocha)">自动适应屏幕大小</small></div><div class="switch on" id="swZoom" onclick="toggleZoomAuto()"></div></div>
    <div class="zoom-row">
      <button class="btn soft" onclick="zoomBy(-0.1)">缩小</button>
      <button class="btn soft" onclick="zoomBy(0.1)">放大</button>
      <button class="btn soft" onclick="zoomAuto()">适应屏幕</button>
    </div>
    <button class="btn soft" style="width:100%" onclick="clearAll()">清空菜单</button>
  </section>
</div>

<div class="auth hidden" id="authView">
  <div class="box">
    <h2>今天吃什么</h2>
    <div class="seg"><button id="segLogin" class="on" onclick="authMode('login')">登录</button><button id="segReg" onclick="authMode('reg')">注册</button></div>
    <input id="authEmail" type="email" placeholder="邮箱">
    <input id="authUser" placeholder="用户名（2-20 位）">
    <input id="authPass" type="password" placeholder="密码（至少 6 位）">
    <button class="btn" id="authBtn" onclick="doAuth()">登录 ♡</button>
    <div class="note">账户数据将存储至云端（Supabase）· 登录状态保持 12 小时，之后自动退出</div>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="sky-beams" id="beams"></div>
  <div style="position:relative;max-width:760px;margin:0 auto;padding:16px">
    <div class="sub" style="text-align:left;font-weight:700;color:var(--rose2)">祈愿结果</div>
    <div id="overlayCards" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px 0"></div>
    <div id="overlayDone" class="hidden result-box">
      <div class="sub">恭喜获得</div>
      <div class="rname" id="bestName"></div>
      <div style="margin:10px 0"><span id="bestStars"></span></div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn" id="againBtn">再来一发</button>
        <button class="btn soft" onclick="closeOverlay()">返回</button>
      </div>
    </div>
  </div>
</div>

async function cloudReq(path, opts){
  const c = cloudCfg(); if(!c) throw new Error("no-cloud");
  const s = SiteDB.session();
  const token = s ? s.access_token : c.key;
  const r = await fetch(c.url.replace(/\/+$/,"") + path, { method: opts.method || "GET", headers: { apikey: c.key, Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if(!r.ok){ const j = await r.json().catch(()=>({})); throw new Error(j.message || j.msg || ("请求失败 " + r.status)); }
  return r.json();
}
function cloudUserKey(){ const s = SiteDB.session(); const username = (s.user_metadata && s.user_metadata.username) || s.email; return cloudCfg().siteId + ":" + username; }
async function cloudSave(){ try{ if(!cloudCfg() || !SiteDB.session()) return; const key = cloudUserKey(); const payload = { beans: state.beans, menu: state.menu, prefs: state.prefs, history: state.history }; const rows = await cloudReq("/rest/v1/sl_data?username=eq." + encodeURIComponent(key), { method: "PUT", body: { username: key, data: payload } }); if(!rows || !rows.length){ await cloudReq("/rest/v1/sl_data", { method: "POST", body: { username: key, data: payload } }); } }catch(e){ console.warn(e); } }
async function cloudLoad(){ try{ if(!cloudCfg() || !SiteDB.session()) return; const key = cloudUserKey(); const rows = await cloudReq("/rest/v1/sl_data?username=eq." + encodeURIComponent(key) + "&select=data"); if(rows && rows[0] && rows[0].data){ state = { beans:15, menu:[], prefs:{sound:true,motion:true}, history:[], ...rows[0].data }; } }catch(e){ console.warn(e); } }

const WHEEL_COLORS = ["#ffd7e6","#fff1c9","#d7f4e8","#dcebff","#efe6ff","#ffe3d6"];

function renderWheel(){

function spinWheel(){
  const foods = state.menu.slice(0, 12);
  if(foods.length === 0){ toast("先去菜单加点菜吧"); return; }
  if(spinning) return;
  if(state.beans < 1){ toast("松鼠豆不够啦，先点「点我领 10 颗」"); return; }
  state.beans -= 1; persist(); renderBeans();
  spinning = true;
  const target = Math.floor(Math.random() * foods.length);
  const seg = 360 / foods.length;
  const jitter = seg * (0.18 + Math.random() * 0.64);
  const targetAngle = (360 - (target * seg + jitter)) % 360;
  wheelRotation += 360 * (5 + Math.floor(Math.random() * 3)) + targetAngle;
  $("wheel").style.transform = "rotate(" + wheelRotation + "deg)";
  setTimeout(() => { spinning = false; showResult(foods[target]); }, 4300);

/* 抽卡 */
function assignStars(list){
  const a = list.slice().sort(() => Math.random() - 0.5);
  const n = a.length;
  if(n === 0) return [];
  const n5 = Math.max(1, Math.min(3, Math.round(n * 0.15)));
  const n4 = Math.max(0, Math.min(n - n5, Math.round(n * 0.3)));
  return a.map((f, i) => ({ ...f, star: i < n5 ? 5 : i < n5 + n4 ? 4 : 3 }));
}
const STAR_COLORS = { 5: "#f6c453", 4: "#c9a6ff", 3: "#6fc1ff" };
const STAR_DEEP = { 5: "#b8860b", 4: "#7d4fc8", 3: "#2f7fd0" };
function starsHtml(n, size){ let h = ""; for(let i=0;i<n;i++){ h += '<span class="star" style="width:' + size + 'px;height:' + size + 'px;background:' + STAR_COLORS[n] + '"></span>'; } return h; }
function buildPool(){ pool = assignStars(state.menu); const c = {5:0,4:0,3:0}; pool.forEach(p => c[p.star]++); $("poolChips").innerHTML = ["5:" + c[5], "4:" + c[4], "3:" + c[3]].map(s => { const [k, v] = s.split(":"); return '<span class="chip">' + starsHtml(Number(k), 11) + " " + v + " 道" + ["","五星","四星","三星"][Number(k)] + "</span>"; }).join(""); }
function doWish(count){
  if(pool.length === 0){ toast("先去菜单加点菜吧"); return; }
  if(state.beans < count){ toast("松鼠豆不够啦，先点「点我领 10 颗」"); return; }
  state.beans -= count; persist(); renderBeans();
  overlayCount = count; revealed = 0; best = null; cards = [];
  const picks = Array.from({ length: count }, () => pool[Math.floor(Math.random() * pool.length)]);
  best = picks.reduce((a, b) => b.star > a.star ? b : a, picks[0]);
  const order = picks.slice().sort((a, b) => b.star - a.star);
  $("overlay").classList.remove("hidden"); $("overlayDone").classList.add("hidden");
  $("overlayCards").innerHTML = picks.map((p, i) => cardHtml(p, i)).join("");
  document.body.style.overflow = "hidden";
  order.forEach((p, i) => {
    setTimeout(() => {
      const el = $("card-" + picks.indexOf(p));
      if(el) el.classList.add("open");
      revealed++;
      if(i === order.length - 1){
        setTimeout(() => {
          $("bestName").textContent = best.name;
          $("bestStars").innerHTML = starsHtml(best.star, 18);
          $("overlayDone").classList.remove("hidden");
          $("againBtn").onclick = () => doWish(overlayCount);
          state.history.unshift({ name: best.name, emoji: best.emoji, star: best.star, time: Date.now() });
          persist();
        }, 500);
      }
    }, 500 + i * 220);
  });
}
function cardHtml(p, i){
  const c = STAR_COLORS[p.star];
  return '<div class="pcard" id="card-' + i + '" style="--star:' + c + ';--glow:' + hexA(c, .35) + '">' +
    '<div class="glow" style="display:none"></div>' +
    '<div class="back">✦</div>' +
    '<div class="face"><div style="position:absolute;inset:0;border-radius:12px;background:radial-gradient(circle,' + hexA(c,.28) + ' 0%,transparent 70%);opacity:0;transition:opacity .4s" data-glow="1"></div>' + foodImg(p.emoji, 38) + '<div class="nm">' + p.name + "</div>" + starsHtml(p.star, 9) + "</div></div>";
}
function hexA(hex, a){ const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16); return "rgba(" + r + "," + g + "," + b + "," + a + ")"; }

let locating = false;
function locateCity(){
  if(!navigator.geolocation){ toast("浏览器不支持定位，请手动选择"); return; }
  locating = true; buildRank();
  navigator.geolocation.getCurrentPosition(async (pos) => {
    try{
      const r = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" + pos.coords.latitude + "&longitude=" + pos.coords.longitude + "&localityLanguage=zh");
      const data = await r.json();
      const name = String(data.city || data.locality || "");
      const hit = CITIES.find(c => name.includes(c[1]) || c[1].includes(name));
      if(hit){ city = hit[0]; toast("定位到 " + hit[1] + " ♡"); }
      else toast(name ? "定位到 " + name + "，暂无专属榜单" : "未能识别城市");
    }catch(e){ toast("定位成功，识别城市失败"); }
    locating = false; buildRank();
  }, () => { locating = false; buildRank(); toast("定位失败，请手动选择"); }, { timeout: 8000 });

    return api("/rest/v1/form_submissions", {
      method: "POST",
      body: { site_id: CFG.siteId, payload: data || {} }
    }).then(function () {
      toast("提交成功，感谢反馈！", true);
    }).catch(function (e) {
      toast("提交失败：" + e.message);
      throw e;
    });
  }

  function submitForm(evt) {
    if (evt && evt.preventDefault) { evt.preventDefault(); }
    var form = evt && evt.target;
    var data = {};
    if (form) {
      var fd = new FormData(form);
      fd.forEach(function (v, k) { data[k] = v; });
    }
    return submitJson(data);
  }

  window.SiteDB = {
    register: register,
    login: login,
    logout: logout,
    submitForm: submitForm,
    submitJson: submitJson,
    session: function () { return session; },
    config: CFG
  };

})();

</script>
</body>
</html>
